name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tests:
    name: Tests and lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install test dependencies
        # Editable namespace hooks are not filesystem paths HA can scan.
        run: python -m pip install ".[test]"
      - name: Check code style
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests
        run: python -m pytest -q

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Validate integration and brand images
        # Match hacs/default: custom-integration brand warnings block admission.
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/github/workspace" \
            ghcr.io/home-assistant/hassfest:latest | tee /tmp/hassfest.log
          if grep -F "[WARNING] [BRAND_IMAGES]" /tmp/hassfest.log; then
            exit 1
          fi

  marketplace:
    name: Marketplace
    runs-on: ubuntu-latest
    steps:
      - name: Validate Marketplace repository
        # Marketplace still uses this upstream validator and hacs.json.
        uses: hacs/action@main
        with:
          category: integration
          comment: false
